name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment (dev|qa|prd)"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - prd

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Comprobar variables
        run: |
          if [[ -z "${{ vars.GCP_PROJECT_ID }}" ]]; then
            echo "::error::Define la variable del Environment GCP_PROJECT_ID (output de dp-proj-00-02-infra)."
            exit 1
          fi
          if [[ -z "${{ vars.BACKEND_BASE_URL }}" ]]; then
            echo "::error::Define BACKEND_BASE_URL (URL base del backend Cloud Run del ambiente)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@jchaconm88"

      - name: Install dependencies
        run: npm ci --workspaces=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WEB_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"

      - name: Deploy Web hosting & Firestore rules
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: firebase deploy --project "${GCP_PROJECT_ID}" --only hosting,firestore:rules --non-interactive
